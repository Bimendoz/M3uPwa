<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Listas M3U</title>
  <meta name="description" content="Busca canales por nombre, pruébalos y arma listas M3U/M3U8 para CarTV, VLC y apps IPTV.">
  <meta name="theme-color" content="#111317">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Listas M3U">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    :root {
      --bg: #111317; --card: #1a1d23; --card2: #22262e; --line: #2c313a; --text: #eceef1; --muted: #9aa0aa;
      --accent: #ff5a5f; --ok: #3ecf7e; --info: #5b8cff; --warn: #e0a84a;
      --top: env(safe-area-inset-top, 0px); --bottom: env(safe-area-inset-bottom, 0px);
      --alto: 100vh; --despl: 0px; --nav: 58px;
      color-scheme: dark;
    }
    @media (prefers-color-scheme: light) {
      :root { --bg: #f4f5f7; --card: #fff; --card2: #eef0f3; --line: #dfe2e7; --text: #15171b; --muted: #636973; --info: #2f6fde; --ok: #1f9d55; --warn: #b7791f; --accent: #e5484d; color-scheme: light; }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--bg); color: var(--text); overflow-x: hidden; }
    body { font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", sans-serif; -webkit-text-size-adjust: 100%; }
    button, input, select { font: inherit; color: inherit; }
    input, select { font-size: 16px; } /* 16px: Safari no hace zoom al enfocar */

    header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      padding: calc(var(--top) + 10px) 16px 10px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
    header h1 { font-size: 19px; margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pill { font-size: 12.5px; padding: 4px 10px; border-radius: 14px; background: var(--card2); color: var(--muted); max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border: 0; }

    main { padding: 14px 16px calc(var(--nav) + var(--bottom) + 24px); max-width: 720px; margin: 0 auto; }
    .view[hidden] { display: none; }

    nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; background: color-mix(in srgb, var(--card) 94%, transparent);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding-bottom: var(--bottom); }
    nav.tabs button { flex: 1; height: var(--nav); border: 0; background: none; color: var(--muted); font-size: 11px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
    nav.tabs button .i { font-size: 21px; line-height: 1; }
    nav.tabs button.on { color: var(--info); }

    .search { display: flex; gap: 8px; }
    .search input { flex: 1; min-width: 0; }
    .field { width: 100%; padding: 11px 12px; border-radius: 11px; border: 1px solid var(--line); background: var(--card); outline: none; }
    .field:focus { border-color: var(--info); }
    .btn { border: 1px solid var(--line); background: var(--card); border-radius: 11px; padding: 10px 14px; font-weight: 600; min-height: 44px; cursor: pointer; white-space: nowrap; }
    .btn:disabled { opacity: .45; }
    .btn.primary { background: var(--info); border-color: var(--info); color: #fff; }
    .btn.danger { color: var(--accent); }
    .btn.sm { min-height: 36px; padding: 6px 11px; font-size: 13.5px; border-radius: 9px; }
    .btn.icon { min-width: 44px; padding: 0; font-size: 18px; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .grow { flex: 1; min-width: 0; }
    .muted { color: var(--muted); }
    .small { font-size: 13px; }
    .hint { color: var(--muted); font-size: 13.5px; margin: 10px 2px; }
    .empty { text-align: center; color: var(--muted); padding: 34px 12px; }
    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 20px 2px 8px; display: flex; align-items: center; gap: 8px; }
    h2 .n { font-size: 11.5px; background: var(--card2); border-radius: 9px; padding: 1px 7px; letter-spacing: 0; }

    .status { background: var(--card); border: 1px solid var(--line); border-radius: 13px; padding: 12px; margin-top: 12px; font-size: 14px; }
    .status.run { border-color: var(--info); }
    .status details { margin-top: 6px; color: var(--muted); font-size: 13px; }
    .status li { margin: 2px 0; overflow-wrap: anywhere; }
    .spin { display: inline-block; width: 13px; height: 13px; border: 2px solid var(--info); border-right-color: transparent; border-radius: 50%; animation: sp .8s linear infinite; margin-right: 8px; vertical-align: -2px; }
    @keyframes sp { to { transform: rotate(360deg); } }

    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-top: 10px; }
    .ch { display: flex; gap: 12px; align-items: center; }
    .logo { width: 48px; height: 48px; flex: 0 0 48px; border-radius: 10px; background: var(--card2); object-fit: contain; display: grid; place-items: center; font-size: 20px; color: var(--muted); overflow: hidden; }
    .ch .t { min-width: 0; flex: 1; }
    .ch .t b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15.5px; }
    .meta { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
    .ok { color: var(--ok); } .bad { color: var(--accent); } .warn { color: var(--warn); }
    .acts { display: flex; gap: 8px; margin-top: 10px; }
    .acts .btn { flex: 1; }
    .acts .btn.icon { flex: 0 0 44px; }
    .acts .btn { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    @media (max-width: 360px) { /* iPhone SE y Android chicos */
      main { padding-left: 12px; padding-right: 12px; }
      .logo { width: 40px; height: 40px; flex-basis: 40px; }
      .ch { gap: 9px; }
      .ch .btn.icon { min-width: 40px; }
      .card { padding: 10px; }
    }

    .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 6px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { flex: 0 0 auto; border: 1px solid var(--line); background: var(--card); border-radius: 18px; padding: 7px 13px; font-size: 14px; font-weight: 600; max-width: 70vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-height: 36px; }
    .chip.on { background: var(--info); border-color: var(--info); color: #fff; }
    .chip.add { border-style: dashed; color: var(--info); }

    .listhead { display: flex; align-items: center; gap: 8px; margin: 12px 0 4px; }
    .listhead b { font-size: 20px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .set { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-top: 12px; }
    .set h3 { margin: 0 0 4px; font-size: 16px; }
    .set label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 12px 0 5px; }
    .set a { color: var(--info); }

    /* hoja inferior: usa --alto/--despl medidos con visualViewport para que el teclado nunca tape campos ni botones */
    .sheet { position: fixed; left: 0; right: 0; top: var(--despl); height: var(--alto); z-index: 20; display: flex; align-items: flex-end; justify-content: center; background: rgba(0,0,0,.5); }
    .sheet[hidden] { display: none; }
    .panel { width: 100%; max-width: 560px; max-height: calc(100% - var(--top) - 12px); background: var(--card); border-radius: 18px 18px 0 0; display: flex; flex-direction: column; box-shadow: 0 -8px 30px rgba(0,0,0,.35); }
    .panel .ph { display: flex; align-items: center; gap: 8px; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
    .panel .ph b { flex: 1; font-size: 17px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .panel .pb { overflow-y: auto; padding: 12px 16px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
    .panel .pf { display: flex; gap: 8px; padding: 10px 16px calc(10px + var(--bottom)); border-top: 1px solid var(--line); }
    .panel .pf .btn { flex: 1; }
    .panel label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 12px 0 6px; }
    .panel label:first-child { margin-top: 0; }
    .opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 13px 2px; font-size: 16px; min-height: 48px; }
    .opt:last-child { border-bottom: 0; }
    .opt .i { width: 26px; text-align: center; font-size: 19px; }
    .opt.danger { color: var(--accent); }
    .linkbox { font: 13px ui-monospace, Menlo, monospace; overflow-wrap: anywhere; background: var(--card2); border-radius: 10px; padding: 10px; margin: 8px 0; }

    /* reproductor */
    .player { position: fixed; left: 0; right: 0; top: var(--despl); height: var(--alto); z-index: 30; background: #000; display: flex; flex-direction: column; }
    .player[hidden] { display: none; }
    .player .pt { display: flex; align-items: center; gap: 10px; padding: calc(var(--top) + 8px) 12px 8px; color: #fff; }
    .player .pt b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .player video { flex: 1; width: 100%; min-height: 0; background: #000; }
    .player .pm { color: #bbb; font-size: 13px; padding: 8px 14px calc(8px + var(--bottom)); }
    .player .btn { background: rgba(255,255,255,.12); border-color: transparent; color: #fff; }

    #lab { position: fixed; left: 0; bottom: 0; width: 2px; height: 2px; opacity: .01; pointer-events: none; overflow: hidden; }
    #lab video { width: 2px; height: 2px; }
    .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav) + var(--bottom) + 14px); z-index: 40; background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; max-width: calc(100% - 32px); box-shadow: 0 6px 20px rgba(0,0,0,.3); }
    .toast[hidden] { display: none; }
    @media (min-width: 700px) { .panel { border-radius: 18px; margin-bottom: 24px; } }
  </style>
</head>
<body>
  <header>
    <h1 id="title">🔎 Buscar canal</h1>
    <button class="pill" id="activePill" title="Lista activa"></button>
  </header>

  <main>
    <section class="view" id="vSearch">
      <form class="search" id="searchForm" autocomplete="off">
        <input class="field" id="q" type="search" placeholder="Nombre del canal, p. ej. Canal Capital" enterkeyhint="search" autocapitalize="off" spellcheck="false">
        <button class="btn primary" id="btnSearch" type="submit">Buscar</button>
      </form>
      <form class="search" id="pageForm" autocomplete="off" style="margin-top:8px">
        <input class="field" id="pageUrl" type="url" placeholder="…o pega el link de la página donde está" enterkeyhint="go" autocapitalize="off" spellcheck="false">
        <button class="btn" id="btnPage" type="submit">Extraer</button>
      </form>
      <div id="searchOut"></div>
    </section>

    <section class="view" id="vLists" hidden></section>
    <section class="view" id="vSettings" hidden></section>
  </main>

  <nav class="tabs">
    <button data-view="vSearch" class="on"><span class="i">🔎</span>Buscar</button>
    <button data-view="vLists"><span class="i">📺</span>Mis listas</button>
    <button data-view="vSettings"><span class="i">⚙️</span>Ajustes</button>
  </nav>

  <div class="sheet" id="sheet" hidden><div class="panel" role="dialog" aria-modal="true">
    <div class="ph"><b id="sheetTitle"></b><button class="btn icon sm" id="sheetClose" aria-label="Cerrar">✕</button></div>
    <div class="pb" id="sheetBody"></div>
    <div class="pf" id="sheetFoot"></div>
  </div></div>

  <div class="player" id="player" hidden>
    <div class="pt"><b id="playerName"></b><button class="btn sm" id="playerClose">Cerrar</button></div>
    <video id="playerVideo" controls playsinline></video>
    <div class="pm" id="playerMsg"></div>
  </div>

  <div id="lab" aria-hidden="true"></div>
  <div class="toast" id="toast" hidden></div>

  <script src="hls.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
